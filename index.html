<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>thanks for everything ~ Noritem</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />

  <!-- Fonts: Sora (Display) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       canna.sx Design Tokens & Liquid-Glass System
       ========================================================= */
    :root {
      --bg-0: #050507;
      --bg-1: #0b0b12;
      --brand-primary: #f4f4f6;
      --brand-secondary: #b6b6c0;
      --brand-accent: #ffffff;
      --text: #f4f4f8;
      --text-dim: #b3b3c4;
      --text-faint: #7c7c92;
      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-brd: rgba(255, 255, 255, 0.12);
      --glass-brd-h: rgba(255, 255, 255, 0.28);
      --radius: 24px;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg-0);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================
       Aurora Background (Signature canna.sx backdrop)
       ========================================================= */
    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(45rem 45rem at 18% 12%, rgba(244, 244, 246, 0.14), transparent 60%),
        radial-gradient(36rem 36rem at 85% 20%, rgba(182, 182, 192, 0.10), transparent 60%),
        radial-gradient(42rem 42rem at 50% 90%, rgba(255, 255, 255, 0.08), transparent 60%),
        linear-gradient(160deg, var(--bg-1), var(--bg-0));
    }

    @media (min-width: 1024px) and (pointer: fine) {
      .aurora {
        animation: drift 18s var(--ease) infinite alternate;
      }
    }

    @keyframes drift {
      from {
        transform: scale(1) translateY(0);
        filter: hue-rotate(0deg);
      }
      to {
        transform: scale(1.1) translateY(-2%);
        filter: hue-rotate(24deg);
      }
    }

    /* Ambient radial glow centered behind card */
    .ambient-glow {
      position: absolute;
      width: 620px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 244, 246, 0.08) 0%, rgba(182, 182, 192, 0.03) 45%, transparent 70%);
      filter: blur(40px);
      z-index: 1;
      pointer-events: none;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { opacity: 0.6; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1.05); }
    }

    /* =========================================================
       Liquid Glass Card
       ========================================================= */
    .card-wrapper {
      position: relative;
      z-index: 2;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    .liquid-glass-card {
      position: relative;
      background: var(--glass-bg);
      border: 1px solid var(--glass-brd);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border-radius: var(--radius);
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      padding: 4rem 3.5rem;
      text-align: center;
      max-width: 90vw;
      width: 540px;
      transition: transform 0.25s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
      animation: rise 0.8s var(--ease) both;
    }

    .liquid-glass-card:hover {
      border-color: var(--glass-brd-h);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    /* Mobile backdrop-filter fallback for peak performance */
    @media (max-width: 768px) {
      .liquid-glass-card {
        padding: 3rem 2rem;
        backdrop-filter: blur(10px) saturate(130%);
        -webkit-backdrop-filter: blur(10px) saturate(130%);
        background: rgba(12, 12, 18, 0.78);
      }
    }

    /* =========================================================
       Signature Canna Shimmer / Rainbow Typography
       ========================================================= */
    .rainbow-text {
      font-family: 'Sora', system-ui, -apple-system, sans-serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.035em;
      margin-bottom: 1.25rem;
      background: linear-gradient(90deg, #8a8a96, #ffffff, #b6b6c0, #ffffff, #8a8a96);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbow 6s linear infinite;
    }

    @keyframes rainbow {
      to {
        background-position: 300% 0;
      }
    }

    .author {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      font-weight: 500;
      color: var(--brand-secondary);
      letter-spacing: -0.015em;
      display: inline-block;
      transition: color 0.2s var(--ease);
    }

    .liquid-glass-card:hover .author {
      color: var(--brand-accent);
    }

    /* Rise entrance animation */
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Accessibility: Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Aurora Layers -->
  <div class="aurora" aria-hidden="true"></div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Content Card -->
  <main class="card-wrapper">
    <section class="liquid-glass-card">
      <h1 class="rainbow-text">thanks for everything</h1>
      <p class="author">~ Noritem</p>
    </section>
  </main>

  <script>
    // Subtle interactive tilt effect on fine pointer devices
    (function () {
      if (window.matchMedia('(pointer: fine)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const card = document.querySelector('.liquid-glass-card');
        if (!card) return;

        let ticking = false;
        window.addEventListener('mousemove', function (e) {
          if (!ticking) {
            window.requestAnimationFrame(function () {
              const rect = card.getBoundingClientRect();
              const cardCenterX = rect.left + rect.width / 2;
              const cardCenterY = rect.top + rect.height / 2;
              const deltaX = (e.clientX - cardCenterX) / (window.innerWidth / 2);
              const deltaY = (e.clientY - cardCenterY) / (window.innerHeight / 2);

              const rotateX = deltaY * -8;
              const rotateY = deltaX * 8;

              card.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
              ticking = false;
            });
            ticking = true;
          }
        });

        window.addEventListener('mouseleave', function () {
          card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
        });
      }
    })();
  </script>
</body>
</html>
